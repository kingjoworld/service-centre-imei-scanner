<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Service Centre IMEI Scanner</title>

  <script src="https://unpkg.com/@zxing/browser@latest"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      margin: 0;
      padding: 20px;
      color: #222;
    }

    .container {
      max-width: 520px;
      margin: auto;
      background: #fff;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.12);
    }

    h2 {
      text-align: center;
      margin-top: 0;
    }

    #video {
      width: 100%;
      max-height: 420px;
      background: #000;
      border-radius: 10px;
      object-fit: cover;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }

    .start {
      background: #0b57d0;
      color: white;
    }

    .stop {
      background: #555;
      color: white;
    }

    .send {
      background: #198754;
      color: white;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 13px;
      margin-top: 8px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    .status {
      margin-top: 15px;
      padding: 12px;
      border-radius: 8px;
      background: #eef2f5;
      text-align: center;
      min-height: 20px;
    }

    .success {
      color: #198754;
      font-weight: bold;
    }

    .error {
      color: #dc3545;
      font-weight: bold;
    }

    .hint {
      margin-top: 12px;
      font-size: 13px;
      color: #666;
      text-align: center;
      line-height: 1.5;
    }
  </style>
</head>

<body>

<div class="container">

  <h2>📷 IMEI Scanner</h2>

  <p style="text-align:center;">
    Place the IMEI barcode clearly inside the camera view.
  </p>

  <video id="video" autoplay muted playsinline></video>

  <button class="start" id="startButton">
    📷 Start Camera
  </button>

  <button class="stop" id="stopButton">
    ⏹ Stop Camera
  </button>

  <div id="status" class="status">
    Camera not started.
  </div>

  <div class="hint">
    For best results, hold the barcode 10–20 cm from the camera,
    keep it horizontal and make sure the barcode is well lit.
  </div>

  <div style="margin-top:25px;padding-top:20px;border-top:1px solid #ddd;">

    <h3>Enter IMEI Manually</h3>

    <input
      type="text"
      id="imeiInput"
      inputmode="numeric"
      maxlength="16"
      placeholder="Enter 14–16 digit IMEI"
    >

    <button class="send" id="sendButton">
      Send IMEI to Stock System
    </button>

  </div>

</div>

<script>

let codeReader = null;
let controls = null;

const video = document.getElementById('video');
const status = document.getElementById('status');
const startButton = document.getElementById('startButton');
const stopButton = document.getElementById('stopButton');
const sendButton = document.getElementById('sendButton');
const imeiInput = document.getElementById('imeiInput');


function setStatus(message, type = '') {

  status.textContent = message;
  status.className = 'status';

  if (type) {
    status.classList.add(type);
  }
}


/*
 * Extract a 14–16 digit IMEI from
 * the decoded barcode text.
 */
function extractIMEI(text) {

  if (!text) {
    return null;
  }

  const cleaned = String(text).replace(/\D/g, '');

  const match = cleaned.match(/\d{14,16}/);

  return match ? match[0] : null;
}


/*
 * Send the IMEI back to the
 * Service Centre system.
 */
function sendIMEI(value) {

  const imei = extractIMEI(value);

  if (!imei) {

    setStatus(
      'The scanned value is not a valid 14–16 digit IMEI.',
      'error'
    );

    return;
  }

  imeiInput.value = imei;

  if (!window.opener || window.opener.closed) {

    setStatus(
      'Please open this scanner from the Service Centre system.',
      'error'
    );

    return;
  }

  window.opener.postMessage(
    {
      type: 'IMEI_SCANNED',
      imei: imei
    },
    '*'
  );

  setStatus(
    'IMEI ' + imei + ' detected and sent successfully.',
    'success'
  );

  stopScanner();
}


/*
 * Start the dedicated 1D scanner.
 */
async function startScanner() {

  try {

    stopScanner();

    if (!window.ZXingBrowser) {

      setStatus(
        'The barcode scanner library could not be loaded. Check your internet connection.',
        'error'
      );

      return;
    }

    setStatus(
      'Preparing 1D barcode scanner...'
    );

    /*
     * Dedicated 1D barcode reader.
     *
     * This is different from the previous
     * general multi-format reader.
     */
    codeReader =
      new ZXingBrowser.BrowserMultiFormatOneDReader();

    /*
     * Find available cameras.
     */
    const devices =
      await ZXingBrowser.BrowserCodeReader
        .listVideoInputDevices();

    if (!devices || devices.length === 0) {

      setStatus(
        'No camera was found.',
        'error'
      );

      return;
    }

    /*
     * Prefer a rear/environment camera.
     * On laptops this normally falls back
     * to the available webcam.
     */
    let selectedDeviceId =
      devices[0].deviceId;

    for (const device of devices) {

      const label =
        (device.label || '').toLowerCase();

      if (
        label.includes('back') ||
        label.includes('rear') ||
        label.includes('environment')
      ) {

        selectedDeviceId =
          device.deviceId;

        break;
      }
    }

    setStatus(
      'Camera ready. Looking for the IMEI barcode...'
    );

    /*
     * Continuously scan the camera.
     */
    controls =
      await codeReader.decodeFromVideoDevice(
        selectedDeviceId,
        video,
        (result, error) => {

          if (result) {

            const rawValue =
              result.getText();

            console.log(
              '1D barcode detected:',
              rawValue
            );

            const imei =
              extractIMEI(rawValue);

            if (imei) {

              sendIMEI(imei);

            } else {

              setStatus(
                'Barcode detected, but it does not contain a valid IMEI. Keep scanning...',
                'error'
              );
            }
          }

        }
      );

    setStatus(
      'Camera is active. Hold the IMEI barcode steady in the frame.'
    );

  } catch (error) {

    console.error(
      'Scanner error:',
      error
    );

    setStatus(
      'Unable to start the 1D barcode scanner: ' +
      (error.message || 'Unknown error'),
      'error'
    );
  }
}


/*
 * Stop scanner and camera.
 */
function stopScanner() {

  try {

    if (controls) {

      controls.stop();
      controls = null;
    }

    codeReader = null;

    if (video.srcObject) {

      video.srcObject
        .getTracks()
        .forEach(track => track.stop());

      video.srcObject = null;
    }

  } catch (error) {

    console.error(error);
  }
}


/*
 * Button events.
 */
startButton.addEventListener(
  'click',
  startScanner
);


stopButton.addEventListener(
  'click',
  () => {

    stopScanner();

    setStatus(
      'Camera stopped.'
    );
  }
);


sendButton.addEventListener(
  'click',
  () => {

    sendIMEI(
      imeiInput.value
    );
  }
);


window.addEventListener(
  'beforeunload',
  stopScanner
);

</script>

</body>
</html>
