<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

 <title>Service Centre IMEI Scanner v2</title>
  
  <!-- ZXing Browser barcode scanner -->
  <script src="https://unpkg.com/@zxing/browser@latest"></script>

  <style>

    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      padding: 20px;
      font-family: Arial, Helvetica, sans-serif;
      background: #f4f6f8;
      color: #222;
      text-align: center;
    }

    .container {
      width: 100%;
      max-width: 520px;
      margin: 0 auto;
      background: #ffffff;
      padding: 20px;
      border-radius: 16px;
      box-shadow: 0 4px 18px rgba(0,0,0,0.10);
    }

    h1 {
      margin-top: 0;
      font-size: 24px;
    }

    .subtitle {
      color: #666;
      font-size: 14px;
      margin-bottom: 18px;
    }

    .scanner-box {
      position: relative;
      width: 100%;
      background: #000;
      border-radius: 12px;
      overflow: hidden;
    }

    video {
      width: 100%;
      height: auto;
      min-height: 280px;
      display: block;
      object-fit: cover;
      background: #000;
    }

    .scan-frame {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 75%;
      height: 90px;
      transform: translate(-50%, -50%);
      border: 3px solid #00ff66;
      border-radius: 10px;
      pointer-events: none;
      box-shadow:
        0 0 0 9999px rgba(0,0,0,0.25);
    }

    .scan-line {
      position: absolute;
      left: 5%;
      right: 5%;
      top: 50%;
      height: 2px;
      background: #00ff66;
      animation: scanLine 2s linear infinite;
    }

    @keyframes scanLine {
      0% {
        top: 10%;
      }

      50% {
        top: 90%;
      }

      100% {
        top: 10%;
      }
    }

    .status {
      margin: 15px 0;
      padding: 12px;
      border-radius: 8px;
      background: #eef3f7;
      font-size: 14px;
      line-height: 1.5;
    }

    .status.success {
      background: #e8f8ee;
      color: #126b35;
    }

    .status.error {
      background: #fdeaea;
      color: #9b1c1c;
    }

    .status.warning {
      background: #fff5dc;
      color: #7a5600;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 8px;
      padding: 14px;
      margin-top: 10px;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    .start-btn {
      background: #0b57d0;
      color: white;
    }

    .stop-btn {
      background: #555;
      color: white;
    }

    .manual-btn {
      background: #198754;
      color: white;
    }

    button:disabled {
      opacity: 0.5;
      cursor: not-allowed;
    }

    .manual-section {
      margin-top: 22px;
      padding-top: 20px;
      border-top: 1px solid #ddd;
    }

    input {
      width: 100%;
      padding: 14px;
      font-size: 17px;
      border: 1px solid #bbb;
      border-radius: 8px;
      margin-top: 8px;
      text-align: center;
      letter-spacing: 1px;
    }

    .result {
      margin-top: 15px;
      padding: 14px;
      border-radius: 8px;
      background: #f1f1f1;
      font-weight: bold;
      word-break: break-all;
    }

    .hidden {
      display: none;
    }

    .small {
      font-size: 12px;
      color: #777;
      margin-top: 10px;
      line-height: 1.5;
    }

  </style>
</head>

<body>

<div class="container">

  <h1>📷 IMEI Scanner</h1>

  <div class="subtitle">
    Point your phone camera at the IMEI barcode.
  </div>

  <div class="scanner-box">

    <video
      id="video"
      autoplay
      muted
      playsinline>
    </video>

    <div
      id="scanFrame"
      class="scan-frame hidden">

      <div class="scan-line"></div>

    </div>

  </div>

  <div
    id="status"
    class="status">

    Scanner is ready.

  </div>

  <button
    id="startButton"
    class="start-btn"
    onclick="startScanner()">

    📷 Start Camera

  </button>

  <button
    id="stopButton"
    class="stop-btn"
    onclick="stopScanner()"
    disabled>

    🛑 Stop Camera

  </button>

  <div
    id="result"
    class="result hidden">
  </div>

  <div class="manual-section">

    <strong>Manual IMEI Entry</strong>

    <input
      id="manualIMEI"
      type="tel"
      inputmode="numeric"
      autocomplete="off"
      placeholder="Enter 15-digit IMEI"
      maxlength="16"
    >

    <button
      class="manual-btn"
      onclick="sendManualIMEI()">

      📤 Send IMEI to Stock System

    </button>

  </div>

  <div class="small">

    If automatic scanning does not detect the barcode,
    you can enter the IMEI manually above.

  </div>

</div>


<script>

  let codeReader = null;

  let scannerControls = null;

  let scanning = false;

  let scanAlreadySent = false;


  /*
   * ----------------------------------------------------
   * STATUS DISPLAY
   * ----------------------------------------------------
   */

  function setStatus(message, type = '') {

    const status =
      document.getElementById('status');

    status.textContent = message;

    status.className = 'status';

    if (type) {
      status.classList.add(type);
    }

  }


  /*
   * ----------------------------------------------------
   * CLEAN IMEI
   * ----------------------------------------------------
   */

  function cleanIMEI(value) {

    return String(value || '')
      .replace(/\D/g, '')
      .trim();

  }


  /*
   * ----------------------------------------------------
   * VALIDATE IMEI
   * ----------------------------------------------------
   */

  function isValidIMEI(value) {

    const imei = cleanIMEI(value);

    /*
     * Most IMEIs are 15 digits.
     * We allow 14-16 because your Apps Script
     * registration function already allows 14-16.
     */

    if (!/^\d{14,16}$/.test(imei)) {
      return false;
    }

    return true;

  }


  /*
   * ----------------------------------------------------
   * SEND IMEI TO PARENT SERVICE CENTRE WINDOW
   * ----------------------------------------------------
   */

  function sendIMEI(imei) {

    imei = cleanIMEI(imei);

    if (!isValidIMEI(imei)) {

      setStatus(
        'The scanned value does not look like a valid IMEI. Please try again.',
        'warning'
      );

      return false;
    }


    /*
     * Prevent the scanner from sending
     * the same barcode repeatedly.
     */

    if (scanAlreadySent) {
      return false;
    }

    scanAlreadySent = true;


    /*
     * Show result.
     */

    const result =
      document.getElementById('result');

    result.textContent =
      'IMEI detected: ' + imei;

    result.classList.remove('hidden');


    setStatus(
      'IMEI detected. Sending to the Service Centre system...',
      'success'
    );


    /*
     * Send IMEI back to the Apps Script window.
     */

    if (
      window.opener &&
      !window.opener.closed
    ) {

      window.opener.postMessage(
        {
          type: 'IMEI_SCANNED',
          imei: imei
        },
        'https://script.google.com'
      );

      /*
       * Also send with wildcard as a fallback.
       * This helps when the Apps Script deployment
       * redirects through another Google domain.
       */

      window.opener.postMessage(
        {
          type: 'IMEI_SCANNED',
          imei: imei
        },
        '*'
      );


      setStatus(
        '✅ IMEI sent successfully to the Service Centre system.',
        'success'
      );

    } else {

      setStatus(
        'The Service Centre window is not available. Please enter the IMEI manually in the main system.',
        'error'
      );

    }


    stopScanner();

    return true;

  }


  /*
   * ----------------------------------------------------
   * START SCANNER
   * ----------------------------------------------------
   */

  async function startScanner() {

    if (scanning) {
      return;
    }


    scanAlreadySent = false;


    const video =
      document.getElementById('video');

    const scanFrame =
      document.getElementById('scanFrame');

    const startButton =
      document.getElementById('startButton');

    const stopButton =
      document.getElementById('stopButton');


    setStatus(
      'Starting camera... Please allow camera permission if requested.'
    );


    try {

      /*
       * Make sure the browser supports camera access.
       */

      if (
        !navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia
      ) {

        throw new Error(
          'Camera access is not supported by this browser.'
        );

      }


      /*
       * Make sure ZXing loaded.
       */

      if (
        typeof ZXingBrowser === 'undefined'
      ) {

        throw new Error(
          'The barcode scanning library could not be loaded. Please check your internet connection.'
        );

      }


      /*
       * Create multi-format reader.
       */

      codeReader =
        new ZXingBrowser.BrowserMultiFormatReader();


      scanning = true;


      startButton.disabled = true;

      stopButton.disabled = false;

      scanFrame.classList.remove('hidden');


      setStatus(
        '📷 Camera starting... Point it at the IMEI barcode.'
      );


      /*
       * Ask ZXing to use the environment/rear camera.
       *
       * Passing null lets ZXing use its preferred
       * camera, with environment-facing camera preferred.
       */

      scannerControls =
        await codeReader.decodeFromVideoDevice(
          undefined,
          video,
          (result, error) => {

            /*
             * A result means a barcode was successfully
             * decoded.
             */

            if (result) {

              const text =
                result.getText();

              sendIMEI(text);

              return;
            }


            /*
             * Normal "nothing found yet" errors are
             * ignored because the scanner keeps looking.
             */

          }
        );


      setStatus(
        '📷 Scanner active. Point the camera at the IMEI barcode.'
      );

    } catch (error) {

      console.error(
        'Scanner error:',
        error
      );


      scanning = false;

      startButton.disabled = false;

      stopButton.disabled = true;

      scanFrame.classList.add('hidden');


      let message =
        'Camera could not be started.';


      if (
        error &&
        error.name === 'NotAllowedError'
      ) {

        message =
          'Camera permission was denied. Please allow Camera permission for Chrome and try again.';

      } else if (
        error &&
        error.name === 'NotFoundError'
      ) {

        message =
          'No camera was found on this device.';

      } else if (
        error &&
        error.name === 'NotReadableError'
      ) {

        message =
          'The camera is currently being used by another application. Close other camera/video apps and try again.';

      } else if (
        error &&
        error.name === 'SecurityError'
      ) {

        message =
          'The browser blocked camera access for security reasons. Please open the scanner using HTTPS.';

      } else if (
        error &&
        error.message
      ) {

        message =
          error.message;

      }


      setStatus(
        '❌ ' + message,
        'error'
      );

    }

  }


  /*
   * ----------------------------------------------------
   * STOP SCANNER
   * ----------------------------------------------------
   */

  function stopScanner() {

    try {

      if (scannerControls) {

        if (
          typeof scannerControls.stop ===
          'function'
        ) {

          scannerControls.stop();

        }

      }

    } catch (error) {

      console.log(
        'Scanner controls stop error:',
        error
      );

    }


    scannerControls = null;


    /*
     * Stop any active video tracks.
     */

    const video =
      document.getElementById('video');


    if (
      video &&
      video.srcObject
    ) {

      const tracks =
        video.srcObject.getTracks();

      tracks.forEach(track => {
        track.stop();
      });

      video.srcObject = null;

    }


    scanning = false;


    document.getElementById(
      'startButton'
    ).disabled = false;


    document.getElementById(
      'stopButton'
    ).disabled = true;


    document.getElementById(
      'scanFrame'
    ).classList.add('hidden');


    setStatus(
      'Scanner stopped. Tap "Start Camera" to scan again.'
    );

  }


  /*
   * ----------------------------------------------------
   * MANUAL IMEI
   * ----------------------------------------------------
   */

  function sendManualIMEI() {

    const input =
      document.getElementById(
        'manualIMEI'
      );


    const imei =
      cleanIMEI(input.value);


    if (!isValidIMEI(imei)) {

      setStatus(
        'Please enter a valid 14-16 digit IMEI.',
        'warning'
      );

      input.focus();

      return;

    }


    scanAlreadySent = false;

    sendIMEI(imei);

  }


  /*
   * ----------------------------------------------------
   * ENTER KEY FOR MANUAL IMEI
   * ----------------------------------------------------
   */

  document
    .getElementById('manualIMEI')
    .addEventListener(
      'keydown',
      function(event) {

        if (
          event.key === 'Enter'
        ) {

          event.preventDefault();

          sendManualIMEI();

        }

      }
    );


  /*
   * ----------------------------------------------------
   * CLEANUP WHEN WINDOW CLOSES
   * ----------------------------------------------------
   */

  window.addEventListener(
    'beforeunload',
    function() {

      stopScanner();

    }
  );


  /*
   * ----------------------------------------------------
   * INITIAL MESSAGE
   * ----------------------------------------------------
   */

  setStatus(
    'Scanner ready. Tap "Start Camera" to begin.'
  );

</script>

</body>
</html>
