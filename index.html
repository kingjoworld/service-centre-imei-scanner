<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Service Centre IMEI Scanner</title>

  <!-- ZXing barcode scanner -->
  <script src="https://unpkg.com/@zxing/browser@latest"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      margin: 0;
      padding: 20px;
      color: #222;
    }

    .container {
      max-width: 520px;
      margin: auto;
      background: #fff;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.12);
    }

    h2 {
      text-align: center;
      margin-top: 0;
    }

    #video {
      width: 100%;
      max-height: 420px;
      background: #000;
      border-radius: 10px;
      object-fit: cover;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }

    .start {
      background: #0b57d0;
      color: white;
    }

    .stop {
      background: #555;
      color: white;
    }

    .send {
      background: #198754;
      color: white;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 13px;
      margin-top: 8px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    .status {
      margin-top: 15px;
      padding: 12px;
      border-radius: 8px;
      background: #eef2f5;
      text-align: center;
      min-height: 20px;
    }

    .manual {
      margin-top: 25px;
      padding-top: 20px;
      border-top: 1px solid #ddd;
    }

    .success {
      color: #198754;
      font-weight: bold;
    }

    .error {
      color: #dc3545;
      font-weight: bold;
    }
  </style>
</head>

<body>

<div class="container">

  <h2>📷 IMEI Scanner</h2>

  <p style="text-align:center;">
    Point your camera at the IMEI barcode.
  </p>

  <video id="video" autoplay muted playsinline></video>

  <button class="start" id="startButton">
    📷 Start Camera
  </button>

  <button class="stop" id="stopButton">
    ⏹ Stop Camera
  </button>

  <div id="status" class="status">
    Camera not started.
  </div>

  <div class="manual">

    <h3>Enter IMEI Manually</h3>

    <input
      type="text"
      id="imeiInput"
      inputmode="numeric"
      maxlength="16"
      placeholder="Enter 14–16 digit IMEI"
    >

    <button class="send" id="sendButton">
      Send IMEI to Stock System
    </button>

  </div>

</div>

<script>

  let codeReader = null;
  let controls = null;

  const video = document.getElementById('video');
  const status = document.getElementById('status');
  const startButton = document.getElementById('startButton');
  const stopButton = document.getElementById('stopButton');
  const sendButton = document.getElementById('sendButton');
  const imeiInput = document.getElementById('imeiInput');

  function setStatus(message, type = '') {
    status.textContent = message;
    status.className = 'status';

    if (type) {
      status.classList.add(type);
    }
  }

  function cleanIMEI(value) {
    return String(value || '').replace(/\D/g, '');
  }

  function validIMEI(imei) {
    return /^\d{14,16}$/.test(imei);
  }

  function sendIMEI(imei) {

    imei = cleanIMEI(imei);

    if (!validIMEI(imei)) {
      setStatus(
        'Please enter a valid 14–16 digit IMEI.',
        'error'
      );
      return;
    }

    if (window.opener && !window.opener.closed) {

      window.opener.postMessage(
        {
          type: 'IMEI_SCANNED',
          imei: imei
        },
        '*'
      );

      setStatus(
        'IMEI sent successfully to the Service Centre system.',
        'success'
      );

      stopScanner();

    } else {

      setStatus(
        'The Service Centre system window is not available. Please open the scanner from the system.',
        'error'
      );
    }
  }

  async function startScanner() {

    try {

      if (!window.ZXingBrowser) {

        setStatus(
          'Scanner library could not be loaded. Please check your internet connection and reload the page.',
          'error'
        );

        return;
      }

      stopScanner();

      setStatus('Starting camera...');

      codeReader =
        new ZXingBrowser.BrowserMultiFormatReader();

      controls =
        await codeReader.decodeFromVideoDevice(
          undefined,
          video,
          (result, error) => {

            if (result) {

              const text = result.getText();

              const imei = cleanIMEI(text);

              if (validIMEI(imei)) {

                imeiInput.value = imei;

                setStatus(
                  'IMEI detected: ' + imei,
                  'success'
                );

                sendIMEI(imei);

              } else {

                setStatus(
                  'Barcode detected, but it does not contain a valid 14–16 digit IMEI.',
                  'error'
                );
              }
            }

          }
        );

      setStatus(
        'Camera is active. Point it at the IMEI barcode.'
      );

    } catch (error) {

      console.error(error);

      setStatus(
        'Unable to start the camera. Please allow camera permission and try again.',
        'error'
      );
    }
  }

  function stopScanner() {

    try {

      if (controls) {
        controls.stop();
        controls = null;
      }

      if (codeReader) {
        codeReader = null;
      }

      if (video.srcObject) {

        video.srcObject
          .getTracks()
          .forEach(track => track.stop());

        video.srcObject = null;
      }

    } catch (error) {

      console.error(error);
    }
  }

  startButton.addEventListener(
    'click',
    startScanner
  );

  stopButton.addEventListener(
    'click',
    () => {

      stopScanner();

      setStatus(
        'Camera stopped.'
      );

    }
  );

  sendButton.addEventListener(
    'click',
    () => {

      sendIMEI(
        imeiInput.value
      );

    }
  );

  window.addEventListener(
    'beforeunload',
    stopScanner
  );

</script>

</body>
</html>
