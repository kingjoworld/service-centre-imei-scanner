<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KingjoWorld IMEI Scanner</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111827;
      color: #ffffff;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 16px;
    }

    .card {
      width: min(720px, 100%);
      background: #1f2937;
      border-radius: 18px;
      padding: 20px;
      box-shadow: 0 12px 35px rgba(0, 0, 0, 0.35);
    }

    h1 {
      margin: 0 0 6px;
      font-size: 22px;
    }

    .status {
      font-size: 14px;
      color: #d1d5db;
      margin-bottom: 14px;
    }

    .camera {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 10;
      background: #000000;
      border-radius: 14px;
      overflow: hidden;
    }

    video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .guide {
      position: absolute;
      left: 8%;
      right: 8%;
      top: 38%;
      height: 24%;
      border: 3px solid #ffffff;
      border-radius: 12px;
      box-shadow: 0 0 0 9999px rgba(0, 0, 0, 0.18);
      pointer-events: none;
    }

    .hint {
      margin-top: 12px;
      font-size: 14px;
      color: #d1d5db;
      line-height: 1.45;
    }

    button {
      margin-top: 14px;
      border: 0;
      border-radius: 10px;
      padding: 12px 18px;
      font-size: 15px;
      font-weight: 700;
      cursor: pointer;
    }

    #startBtn {
      background: #2563eb;
      color: #ffffff;
    }

    #stopBtn {
      background: #374151;
      color: #ffffff;
      margin-left: 8px;
    }

    .error {
      margin-top: 12px;
      background: #3f1d1d;
      color: #fecaca;
      padding: 12px;
      border-radius: 10px;
      display: none;
      line-height: 1.45;
    }

    .ok {
      margin-top: 12px;
      background: #123524;
      color: #bbf7d0;
      padding: 12px;
      border-radius: 10px;
      display: none;
    }
  </style>
</head>

<body>

  <main class="card">

    <h1>IMEI Camera Scanner</h1>

    <div id="status" class="status">
      Waiting for the Service Centre system...
    </div>

    <div class="camera">

      <video
        id="video"
        playsinline
        muted>
      </video>

      <div class="guide"></div>

    </div>

    <div class="hint">
      Point the rear camera at the IMEI barcode.
      Keep the barcode inside the white guide.
      After a successful scan, the IMEI is sent back automatically.
    </div>

    <button id="startBtn" type="button">
      Start Camera
    </button>

    <button id="stopBtn" type="button">
      Stop Camera
    </button>

    <div id="ok" class="ok"></div>

    <div id="error" class="error"></div>

  </main>


  <script src="https://unpkg.com/@zxing/browser@0.1.5/umd/index.min.js"></script>


  <script>

    const PARENT_ORIGIN = "https://script.google.com";

    const video = document.getElementById("video");

    const statusEl = document.getElementById("status");

    const errorEl = document.getElementById("error");

    const okEl = document.getElementById("ok");

    const startBtn = document.getElementById("startBtn");

    const stopBtn = document.getElementById("stopBtn");


    let reader = null;

    let controls = null;

    let stream = null;

    let scanning = false;

    let lastScan = "";


    function setStatus(message) {

      statusEl.textContent = message;

    }


    function showError(message) {

      errorEl.textContent = message;

      errorEl.style.display = "block";

      okEl.style.display = "none";

    }


    function showOk(message) {

      okEl.textContent = message;

      okEl.style.display = "block";

      errorEl.style.display = "none";

    }


    function cleanIMEI(value) {

      const digits = String(value || "").replace(/\D/g, "");

      return digits.length === 15 ? digits : "";

    }


    function stopCamera() {

      scanning = false;


      if (controls) {

        try {
          controls.stop();
        } catch (e) {}

        controls = null;

      }


      if (reader) {

        try {
          reader.reset();
        } catch (e) {}

      }


      if (stream) {

        stream.getTracks().forEach(track => {

          try {
            track.stop();
          } catch (e) {}

        });

        stream = null;

      }


      video.srcObject = null;


      setStatus(
        "Camera stopped. Press Start Camera to scan again."
      );

    }


    async function startCamera() {

      errorEl.style.display = "none";

      okEl.style.display = "none";


      if (!window.isSecureContext) {

        showError(
          "Camera access requires a secure HTTPS page. Please open the GitHub Pages address, not a local file."
        );

        return;

      }


      if (
        !navigator.mediaDevices ||
        !navigator.mediaDevices.getUserMedia
      ) {

        showError(
          "This browser does not provide camera access on this page. Please use the latest Chrome or Edge."
        );

        return;

      }


      try {

        stopCamera();


        setStatus(
          "Requesting rear camera permission..."
        );


        const permissionStream =
          await navigator.mediaDevices.getUserMedia({

            video: {

              facingMode: {
                ideal: "environment"
              },

              width: {
                ideal: 1280
              },

              height: {
                ideal: 720
              }

            },

            audio: false

          });


        stream = permissionStream;


        video.srcObject = stream;


        await video.play();


        if (!reader) {

          reader =
            new ZXingBrowser.BrowserMultiFormatReader();

        }


        scanning = true;


        setStatus(
          "Camera ready — point at the IMEI barcode."
        );


        controls =
          await reader.decodeFromVideoElement(

            video,

            (result, error) => {

              if (!scanning || !result) {
                return;
              }


              const imei =
                cleanIMEI(result.getText());


              if (!imei || imei === lastScan) {
                return;
              }


              lastScan = imei;

              scanning = false;


              showOk(
                "IMEI detected: " + imei
              );


              try {

                if (
                  window.opener &&
                  !window.opener.closed
                ) {

                  window.opener.postMessage(

                    {
                      type: "IMEI_SCANNED",
                      imei: imei
                    },

                    "*"

                  );

                }

              } catch (e) {}


              setStatus(
                "IMEI sent back to the Service Centre system."
              );

            }

          );


      } catch (err) {

        console.error(err);


        stopCamera();


        let message =
          "Camera could not start.";


        if (
          err &&
          err.name === "NotAllowedError"
        ) {

          message =
            "Camera permission was denied. Click the camera icon in Chrome's address bar, allow Camera, then reload this page.";

        }


        else if (
          err &&
          err.name === "NotFoundError"
        ) {

          message =
            "No camera was found on this device.";

        }


        else if (
          err &&
          err.name === "NotReadableError"
        ) {

          message =
            "The camera is already being used by another application. Close other camera/scanner apps and try again.";

        }


        else if (
          err &&
          err.name === "SecurityError"
        ) {

          message =
            "The browser blocked camera access for security reasons. Make sure this page is opened through HTTPS.";

        }


        showError(message);

      }

    }


    window.addEventListener(
      "message",
      event => {

        if (
          !event.data ||
          typeof event.data !== "object"
        ) {

          return;

        }


        if (
          event.data.type === "ARM_SCANNER"
        ) {

          lastScan = "";

          startCamera();

        }

      }
    );


    startBtn.addEventListener(
      "click",
      startCamera
    );


    stopBtn.addEventListener(
      "click",
      stopCamera
    );


    window.addEventListener(
      "beforeunload",
      stopCamera
    );


    try {

      if (
        window.opener &&
        !window.opener.closed
      ) {

        window.opener.postMessage(
          {
            type: "SCANNER_READY"
          },
          "*"
        );

      }

    } catch (e) {}


  </script>

</body>
</html>
