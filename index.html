<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Service Centre IMEI Scanner</title>

  <script src="https://unpkg.com/@zxing/browser@latest"></script>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      margin: 0;
      padding: 20px;
      color: #222;
    }

    .container {
      max-width: 520px;
      margin: auto;
      background: #fff;
      padding: 20px;
      border-radius: 12px;
      box-shadow: 0 3px 12px rgba(0,0,0,0.12);
    }

    h2 {
      text-align: center;
      margin-top: 0;
    }

    #video {
      width: 100%;
      max-height: 420px;
      background: #000;
      border-radius: 10px;
      object-fit: cover;
    }

    button {
      width: 100%;
      padding: 14px;
      margin-top: 12px;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      cursor: pointer;
    }

    .start {
      background: #0b57d0;
      color: white;
    }

    .stop {
      background: #555;
      color: white;
    }

    .send {
      background: #198754;
      color: white;
    }

    input {
      width: 100%;
      box-sizing: border-box;
      padding: 13px;
      margin-top: 8px;
      border: 1px solid #ccc;
      border-radius: 8px;
      font-size: 16px;
    }

    .status {
      margin-top: 15px;
      padding: 12px;
      border-radius: 8px;
      background: #eef2f5;
      text-align: center;
      min-height: 20px;
    }

    .success {
      color: #198754;
      font-weight: bold;
    }

    .error {
      color: #dc3545;
      font-weight: bold;
    }

    .info {
      margin-top: 15px;
      font-size: 13px;
      color: #666;
      text-align: center;
    }
  </style>
</head>

<body>

<div class="container">

  <h2>📷 IMEI Scanner</h2>

  <p style="text-align:center;">
    Point the camera directly at the IMEI barcode.
  </p>

  <video id="video" autoplay muted playsinline></video>

  <button class="start" id="startButton">
    📷 Start Camera
  </button>

  <button class="stop" id="stopButton">
    ⏹ Stop Camera
  </button>

  <div id="status" class="status">
    Camera not started.
  </div>

  <div class="manual">

    <h3>Enter IMEI Manually</h3>

    <input
      type="text"
      id="imeiInput"
      inputmode="numeric"
      maxlength="16"
      placeholder="Enter 14–16 digit IMEI"
    >

    <button class="send" id="sendButton">
      Send IMEI to Stock System
    </button>

  </div>

  <div class="info">
    Scanner supports common 1D and 2D barcode formats.
  </div>

</div>

<script>

let codeReader = null;
let controls = null;

const video = document.getElementById('video');
const status = document.getElementById('status');
const startButton = document.getElementById('startButton');
const stopButton = document.getElementById('stopButton');
const sendButton = document.getElementById('sendButton');
const imeiInput = document.getElementById('imeiInput');


function setStatus(message, type = '') {

  status.textContent = message;

  status.className = 'status';

  if (type) {
    status.classList.add(type);
  }
}


/*
 * Extract a 14–16 digit IMEI from whatever
 * text the barcode decoder returns.
 */
function extractIMEI(text) {

  if (!text) {
    return null;
  }

  const digits = String(text).replace(/\D/g, '');

  /*
   * Look for a 14–16 digit sequence.
   */
  const match = digits.match(/\d{14,16}/);

  if (match) {
    return match[0];
  }

  return null;
}


function sendIMEI(imei) {

  imei = extractIMEI(imei);

  if (!imei) {

    setStatus(
      'No valid 14–16 digit IMEI was found.',
      'error'
    );

    return;
  }

  imeiInput.value = imei;

  if (window.opener && !window.opener.closed) {

    window.opener.postMessage(
      {
        type: 'IMEI_SCANNED',
        imei: imei
      },
      '*'
    );

    setStatus(
      'IMEI ' + imei + ' sent successfully.',
      'success'
    );

    stopScanner();

  } else {

    setStatus(
      'Scanner was not opened from the Service Centre system.',
      'error'
    );
  }
}


async function startScanner() {

  try {

    stopScanner();

    if (!window.ZXingBrowser) {

      setStatus(
        'ZXing scanner library did not load. Check your internet connection.',
        'error'
      );

      return;
    }

    setStatus(
      'Preparing camera and barcode scanner...'
    );

    /*
     * Create ZXing reader.
     */
    codeReader =
      new ZXingBrowser.BrowserMultiFormatReader();

    /*
     * Get available cameras.
     */
    const devices =
      await ZXingBrowser.BrowserCodeReader
        .listVideoInputDevices();

    if (!devices || devices.length === 0) {

      setStatus(
        'No camera was found on this device.',
        'error'
      );

      return;
    }

    /*
     * Prefer a back/environment camera.
     * If unavailable, use the first camera.
     */
    let selectedDeviceId =
      devices[0].deviceId;

    for (const device of devices) {

      const label =
        (device.label || '').toLowerCase();

      if (
        label.includes('back') ||
        label.includes('rear') ||
        label.includes('environment')
      ) {

        selectedDeviceId =
          device.deviceId;

        break;
      }
    }

    setStatus(
      'Camera found. Starting barcode detection...'
    );

    /*
     * Start continuous decoding.
     */
    controls =
      await codeReader.decodeFromVideoDevice(
        selectedDeviceId,
        video,
        (result, error) => {

          if (result) {

            const rawText =
              result.getText();

            console.log(
              'Barcode detected:',
              rawText
            );

            const imei =
              extractIMEI(rawText);

            if (imei) {

              sendIMEI(imei);

            } else {

              setStatus(
                'Barcode detected, but it does not contain a 14–16 digit IMEI. Keep scanning...',
                'error'
              );
            }
          }

        }
      );

    setStatus(
      'Camera is active. Hold the IMEI barcode steady inside the camera view.'
    );

  } catch (error) {

    console.error(
      'Scanner error:',
      error
    );

    setStatus(
      'Scanner error: ' +
      (error.message || 'Unable to start scanner.'),
      'error'
    );
  }
}


function stopScanner() {

  try {

    if (controls) {

      controls.stop();

      controls = null;
    }

    if (codeReader) {

      codeReader = null;
    }

    if (video.srcObject) {

      video.srcObject
        .getTracks()
        .forEach(track => track.stop());

      video.srcObject = null;
    }

  } catch (error) {

    console.error(error);
  }
}


startButton.addEventListener(
  'click',
  startScanner
);


stopButton.addEventListener(
  'click',
  () => {

    stopScanner();

    setStatus(
      'Camera stopped.'
    );

  }
);


sendButton.addEventListener(
  'click',
  () => {

    sendIMEI(
      imeiInput.value
    );

  }
);


window.addEventListener(
  'beforeunload',
  stopScanner
);

</script>

</body>
</html>
